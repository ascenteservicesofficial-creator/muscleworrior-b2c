 <text x="300" y="300" fill="#fff" font-size="25" font-style="italic" letter-spacing="7">BUILD YOUR</text>
 <text x="296" y="390" fill="url(#gold)" font-size="78" font-weight="900" font-style="italic">STRONGER</text>
 <text x="296" y="466" fill="#fff" font-size="73" font-weight="900" font-style="italic">TOMORROW</text>
 <text x="300" y="516" fill="#ddd" font-size="18">Better Nutrition  |  Higher Performance  |  A Healthier You</text>
 <rect x="300" y="552" width="202" height="53" rx="27" fill="url(#gold)"/><text x="330" y="586" fill="#080808" font-size="19" font-weight="900">SHOP NOW  →</text>
 <g transform="translate(1330 275)" fill="none" stroke="url(#gold)" stroke-width="4"><circle cx="46" cy="0" r="38"/><path d="M22 0H70M29 -15V15M37 -22V22M55 -15V15M63 -22V22"/></g>
 <text x="1410" y="267" fill="#fff" font-size="20" font-weight="800">PREMIUM</text><text x="1410" y="295" fill="url(#gold)" font-size="21" font-weight="900">SUPPLEMENTS</text>
 <g transform="translate(1330 400)" fill="none" stroke="url(#gold)" stroke-width="4"><circle cx="46" cy="0" r="38"/><path d="M26 0L40 14L66 -15"/></g>
 <text x="1410" y="392" fill="#fff" font-size="20" font-weight="800">TRUSTED</text><text x="1410" y="420" fill="url(#gold)" font-size="21" font-weight="900">QUALITY</text>
 <g transform="translate(1330 525)" fill="none" stroke="url(#gold)" stroke-width="4"><circle cx="46" cy="0" r="38"/><path d="M25 13Q28 -13 63 -19Q59 12 25 13ZM25 13L65 -20"/></g>
 <text x="1410" y="517" fill="#fff" font-size="20" font-weight="800">HEALTHIER</text><text x="1410" y="545" fill="url(#gold)" font-size="21" font-weight="900">LIFESTYLE</text>
</g>
<ellipse cx="955" cy="398" rx="250" ry="240" fill="#000" opacity=".6" filter="url(#shadow)"/>
<circle cx="955" cy="380" r="220" fill="#030303" stroke="url(#gold)" stroke-width="8"/>
<image href="/brand/logo.webp" x="710" y="145" width="490" height="480" preserveAspectRatio="xMidYMid meet"/>
