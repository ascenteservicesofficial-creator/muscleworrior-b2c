<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 768" role="img" aria-labelledby="title desc">
<title id="title">Muscle Worrior — Build Your Stronger Tomorrow</title>
<desc id="desc">Black and gold fitness hero banner with Muscle Worrior logo, strong training message, and supplement benefits.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#111"/><stop offset="1" stop-color="#242424"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe900"/><stop offset=".55" stop-color="#ffb000"/><stop offset="1" stop-color="#ff5b00"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#a36b00" stop-opacity=".35"/><stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1920" height="768" fill="url(#bg)"/><rect width="1920" height="768" fill="url(#grid)"/>
<ellipse cx="980" cy="390" rx="610" ry="390" fill="url(#glow)"/>
<path d="M0 0H120L0 120Z" fill="url(#gold)"/><path d="M0 0H75L0 80Z" fill="#050505"/><path d="M0 650L750 715L1150 685L1560 720L1920 630V768H0Z" fill="#050505"/><path d="M0 640L750 702L1155 672L1560 705L1920 615" fill="none" stroke="url(#gold)" stroke-width="12"/><path d="M0 0L105 0L0 105M0 28L80 28" fill="none" stroke="url(#gold)" stroke-width="7"/>
